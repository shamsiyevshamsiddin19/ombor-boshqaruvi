name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wms -d wms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wms:wms@localhost:5432/wms
      # Checks run with production-like settings (DEBUG off), which require a key.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Translation catalogs (ru, en) complete and compiled
        run: python scripts/i18n.py check

      - name: Run tests
        run: python manage.py test

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v5

      - name: Check production branch head
        id: revision
        shell: bash
        run: |
          MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$GITHUB_SHA" == "$MAIN_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping deployment: main has moved to $MAIN_SHA."
          fi

      - name: Configure SSH
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Create release directory and upload code
        if: steps.revision.outputs.current == 'true'
        run: |
          RELEASE="$(date -u +%Y%m%d_%H%M%S)-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh deploy-target "mkdir -p /var/www/wms/releases/$RELEASE"
          rsync -az --delete \
            --exclude-from=deploy/rsync-exclude.txt \
            ./ "deploy-target:/var/www/wms/releases/$RELEASE/"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Migrate, switch release, and check application health
        if: steps.revision.outputs.current == 'true'
        run: >-
          ssh deploy-target
          "RELEASE_DIR=/var/www/wms/releases/$RELEASE
          bash /var/www/wms/releases/$RELEASE/deploy/deploy.sh"
