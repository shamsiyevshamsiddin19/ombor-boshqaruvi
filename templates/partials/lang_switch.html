{% load i18n %}{% get_current_language as current_lang %}{% get_available_languages as languages %}
{# Interface language: UZ / RU / EN. Posts to Django's set_language, which stores a cookie. #}
<form action="{% url 'set_language' %}" method="post" class="w-full" role="group" aria-label="{% translate 'Til' %}">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <div class="grid grid-cols-3 gap-1 rounded-lg border border-line bg-raised p-1 shadow-2xs">
    {% for code, name in languages %}
      <button type="submit" name="language" value="{{ code }}" lang="{{ code }}" title="{{ name }}"
              class="flex items-center justify-center rounded-md {% if compact %}py-1 text-[11px]{% else %}py-1.5 text-xs{% endif %} font-bold transition-all select-none {% if code|lower == current_lang|lower %}bg-ink text-white shadow-xs{% else %}text-muted hover:text-ink font-semibold{% endif %}"
              aria-pressed="{% if code|lower == current_lang|lower %}true{% else %}false{% endif %}">
        {{ code|upper }}
      </button>
    {% endfor %}
  </div>
</form>
