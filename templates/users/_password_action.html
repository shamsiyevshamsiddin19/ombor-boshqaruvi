{% load wms i18n %}
<div x-data="{ open: false }" class="inline-flex flex-wrap items-center gap-1.5">
  <span class="font-mono text-xs" aria-label="{% translate 'Parol' %}">********</span>
  <button type="button" class="btn btn-ghost !px-2" @click="open = !open" :aria-expanded="open"
          aria-label="{% translate 'Parol amallari' %}">
    <span x-show="!open">{% icon "eye" 15 %}</span>
    <span x-show="open" x-cloak>{% icon "eye-off" 15 %}</span>
  </button>
  <a x-show="open" x-cloak href="{% url 'users:user_edit' u.pk %}#password-reset" class="text-xs underline underline-offset-4">
    {% translate "Parolni yangilash" %}
  </a>
</div>
